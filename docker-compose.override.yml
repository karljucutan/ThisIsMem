services:
  api:
    env_file: docker-compose.env # for Azure Entra envi vars: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__MemDatabase=Host=postgres;Port=5432;Database=thisismem;Username=postgres;Password=postgres
      - KnowledgeBase__BusinessRulesPath=/src/knowledgebase/business-rules
      - KnowledgeBase__ProceduresPath=/src/knowledgebase/procedures
      - KnowledgeBase__Procedures__Documents__0__DocumentKey=peripheral-noradrenaline
      - KnowledgeBase__Procedures__Documents__0__PeripheralNoradrenaline=/src/knowledgebase/procedures/HealthCareProfessionals-1092-peripheral-noradrenaline.pdf
      - KnowledgeBase__Procedures__Documents__0__CollectionName=peripheral-noradrenaline
      - KnowledgeBase__Procedures__Documents__1__DocumentKey=united-for-diabetes-philippines
      - KnowledgeBase__Procedures__Documents__1__PeripheralNoradrenaline=/src/knowledgebase/procedures/Diabetes-United-for-Diabetes-Phil.pdf
      - KnowledgeBase__Procedures__Documents__1__CollectionName=united-for-diabetes-philippines
 
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro